<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M$G Fantasy Football League</title>
    <meta name="description" content="The M$G league hub: live standings, matchups, the record book and the betting board. Est. 2012, 14 teams, zero mercy." />
    <meta name="theme-color" content="#070d20" />
    <!-- Link previews (Messenger, iMessage, Facebook, Slack, X…). Crawlers don't
         run JS, so every route shares this one card; per-page cards would need an
         edge function. og:image must be an absolute URL. No og:url on purpose: it's
         the canonical id, and a fixed homepage value would fold every shared deep
         link (/bets…) into the homepage — without it, crawlers use the shared URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M$G Fantasy Football League" />
    <meta property="og:title" content="M$G Fantasy Football League" />
    <meta property="og:description" content="Live standings, matchups, the record book and the betting board. Loser buys. No welshing." />
    <meta property="og:image" content="https://msgffl.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="M$G Fantasy Football League — league hub" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo-circle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
